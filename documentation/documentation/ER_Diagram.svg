<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="750" viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1100" height="750" fill="#0F172A"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="1100" height="60" fill="#0891B2"/>
  <text x="550" y="38" fill="white" font-size="22" font-weight="bold" text-anchor="middle">MultiStore Stock Management System — Diagramme ER</text>

  <!-- ═══════════════ ENTITY: User ═══════════════ -->
  <g id="entity-user">
    <rect x="30" y="100" width="200" height="220" rx="6" fill="#1E293B" stroke="#0891B2" stroke-width="2"/>
    <rect x="30" y="100" width="200" height="40" rx="6" fill="#0D3B66"/>
    <rect x="30" y="126" width="200" height="14" fill="#0D3B66"/>
    <text x="130" y="127" fill="white" font-size="14" font-weight="bold" text-anchor="middle">User</text>
    <!-- PK -->
    <text x="50" y="160" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="75" y="160" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="30" y1="167" x2="230" y2="167" stroke="#334155" stroke-width="1"/>
    <text x="50" y="183" fill="#94A3B8" font-size="11">name : String</text>
    <text x="50" y="200" fill="#94A3B8" font-size="11">email : String (unique)</text>
    <text x="50" y="217" fill="#94A3B8" font-size="11">passwordHash : String</text>
    <text x="50" y="234" fill="#06B6D4" font-size="11">role : admin | manager</text>
    <text x="50" y="251" fill="#F59E0B" font-size="11">FK</text>
    <text x="75" y="251" fill="#94A3B8" font-size="11">branchId : ObjectId</text>
    <text x="50" y="268" fill="#94A3B8" font-size="11">createdAt : Date</text>
    <text x="50" y="285" fill="#94A3B8" font-size="11">isActive : Boolean</text>
    <!-- Cardinality -->
    <text x="130" y="335" fill="#64748B" font-size="10" text-anchor="middle">1 User → 1 Branch</text>
  </g>

  <!-- ═══════════════ ENTITY: Branch ═══════════════ -->
  <g id="entity-branch">
    <rect x="300" y="100" width="200" height="200" rx="6" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <rect x="300" y="100" width="200" height="40" rx="6" fill="#064E3B"/>
    <rect x="300" y="126" width="200" height="14" fill="#064E3B"/>
    <text x="400" y="127" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Branch</text>
    <text x="320" y="160" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="345" y="160" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="300" y1="167" x2="500" y2="167" stroke="#334155" stroke-width="1"/>
    <text x="320" y="183" fill="#94A3B8" font-size="11">name : String</text>
    <text x="320" y="200" fill="#94A3B8" font-size="11">location : String</text>
    <text x="320" y="217" fill="#94A3B8" font-size="11">phone : String</text>
    <text x="320" y="234" fill="#F59E0B" font-size="11">FK</text>
    <text x="345" y="234" fill="#94A3B8" font-size="11">managerId : ObjectId</text>
    <text x="320" y="251" fill="#06B6D4" font-size="11">status : active | inactive</text>
    <text x="320" y="268" fill="#94A3B8" font-size="11">createdAt : Date</text>
    <text x="400" y="315" fill="#64748B" font-size="10" text-anchor="middle">1 Branch → N Inventory</text>
  </g>

  <!-- ═══════════════ ENTITY: Product ═══════════════ -->
  <g id="entity-product">
    <rect x="570" y="100" width="200" height="220" rx="6" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
    <rect x="570" y="100" width="200" height="40" rx="6" fill="#4C1D95"/>
    <rect x="570" y="126" width="200" height="14" fill="#4C1D95"/>
    <text x="670" y="127" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Product</text>
    <text x="590" y="160" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="615" y="160" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="570" y1="167" x2="770" y2="167" stroke="#334155" stroke-width="1"/>
    <text x="590" y="183" fill="#94A3B8" font-size="11">name : String</text>
    <text x="590" y="200" fill="#94A3B8" font-size="11">sku : String (unique)</text>
    <text x="590" y="217" fill="#94A3B8" font-size="11">category : String</text>
    <text x="590" y="234" fill="#94A3B8" font-size="11">unitPrice : Number</text>
    <text x="590" y="251" fill="#94A3B8" font-size="11">description : String</text>
    <text x="590" y="268" fill="#06B6D4" font-size="11">imageUrl : String</text>
    <text x="590" y="285" fill="#94A3B8" font-size="11">createdAt : Date</text>
    <text x="670" y="335" fill="#64748B" font-size="10" text-anchor="middle">1 Product → N Inventory</text>
  </g>

  <!-- ═══════════════ ENTITY: Inventory ═══════════════ -->
  <g id="entity-inventory">
    <rect x="30" y="420" width="220" height="230" rx="6" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
    <rect x="30" y="420" width="220" height="40" rx="6" fill="#78350F"/>
    <rect x="30" y="446" width="220" height="14" fill="#78350F"/>
    <text x="140" y="447" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Inventory</text>
    <text x="50" y="480" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="75" y="480" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="30" y1="487" x2="250" y2="487" stroke="#334155" stroke-width="1"/>
    <text x="50" y="503" fill="#F59E0B" font-size="11">FK</text>
    <text x="75" y="503" fill="#94A3B8" font-size="11">productId : ObjectId</text>
    <text x="50" y="520" fill="#F59E0B" font-size="11">FK</text>
    <text x="75" y="520" fill="#94A3B8" font-size="11">branchId : ObjectId</text>
    <text x="50" y="537" fill="#94A3B8" font-size="11">quantity : Number</text>
    <text x="50" y="554" fill="#94A3B8" font-size="11">minStockAlert : Number</text>
    <text x="50" y="571" fill="#06B6D4" font-size="11">status : ok | low | out</text>
    <text x="50" y="588" fill="#94A3B8" font-size="11">lastUpdated : Date</text>
    <text x="50" y="605" fill="#94A3B8" font-size="11">reservedQty : Number</text>
  </g>

  <!-- ═══════════════ ENTITY: Transfer ═══════════════ -->
  <g id="entity-transfer">
    <rect x="330" y="420" width="220" height="250" rx="6" fill="#1E293B" stroke="#0891B2" stroke-width="2"/>
    <rect x="330" y="420" width="220" height="40" rx="6" fill="#0C4A6E"/>
    <rect x="330" y="446" width="220" height="14" fill="#0C4A6E"/>
    <text x="440" y="447" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Transfer</text>
    <text x="350" y="480" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="375" y="480" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="330" y1="487" x2="550" y2="487" stroke="#334155" stroke-width="1"/>
    <text x="350" y="503" fill="#F59E0B" font-size="11">FK</text>
    <text x="375" y="503" fill="#94A3B8" font-size="11">fromBranchId : ObjectId</text>
    <text x="350" y="520" fill="#F59E0B" font-size="11">FK</text>
    <text x="375" y="520" fill="#94A3B8" font-size="11">toBranchId : ObjectId</text>
    <text x="350" y="537" fill="#F59E0B" font-size="11">FK</text>
    <text x="375" y="537" fill="#94A3B8" font-size="11">productId : ObjectId</text>
    <text x="350" y="554" fill="#94A3B8" font-size="11">quantity : Number</text>
    <text x="350" y="571" fill="#06B6D4" font-size="11">status : pending|done|cancel</text>
    <text x="350" y="588" fill="#F59E0B" font-size="11">FK</text>
    <text x="375" y="588" fill="#94A3B8" font-size="11">initiatedBy : ObjectId</text>
    <text x="350" y="605" fill="#94A3B8" font-size="11">note : String</text>
    <text x="350" y="622" fill="#94A3B8" font-size="11">createdAt : Date</text>
  </g>

  <!-- ═══════════════ ENTITY: Sale ═══════════════ -->
  <g id="entity-sale">
    <rect x="630" y="420" width="220" height="250" rx="6" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
    <rect x="630" y="420" width="220" height="40" rx="6" fill="#7F1D1D"/>
    <rect x="630" y="446" width="220" height="14" fill="#7F1D1D"/>
    <text x="740" y="447" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Sale</text>
    <text x="650" y="480" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="675" y="480" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="630" y1="487" x2="850" y2="487" stroke="#334155" stroke-width="1"/>
    <text x="650" y="503" fill="#F59E0B" font-size="11">FK</text>
    <text x="675" y="503" fill="#94A3B8" font-size="11">branchId : ObjectId</text>
    <text x="650" y="520" fill="#F59E0B" font-size="11">FK</text>
    <text x="675" y="520" fill="#94A3B8" font-size="11">cashierId : ObjectId</text>
    <text x="650" y="537" fill="#94A3B8" font-size="11">items : [SaleItem]</text>
    <text x="670" y="554" fill="#64748B" font-size="10">└ productId, qty, price</text>
    <text x="650" y="571" fill="#94A3B8" font-size="11">totalAmount : Number</text>
    <text x="650" y="588" fill="#06B6D4" font-size="11">paymentMethod : String</text>
    <text x="650" y="605" fill="#94A3B8" font-size="11">discount : Number</text>
    <text x="650" y="622" fill="#94A3B8" font-size="11">createdAt : Date</text>
  </g>

  <!-- ═══════════════ ENTITY: Alert (Notification) ═══════════════ -->
  <g id="entity-alert">
    <rect x="880" y="100" width="200" height="200" rx="6" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <rect x="880" y="100" width="200" height="40" rx="6" fill="#831843"/>
    <rect x="880" y="126" width="200" height="14" fill="#831843"/>
    <text x="980" y="127" fill="white" font-size="14" font-weight="bold" text-anchor="middle">StockAlert</text>
    <text x="900" y="160" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
    <text x="925" y="160" fill="#E2E8F0" font-size="11">_id : ObjectId</text>
    <line x1="880" y1="167" x2="1080" y2="167" stroke="#334155" stroke-width="1"/>
    <text x="900" y="183" fill="#F59E0B" font-size="11">FK</text>
    <text x="925" y="183" fill="#94A3B8" font-size="11">inventoryId : ObjectId</text>
    <text x="900" y="200" fill="#F59E0B" font-size="11">FK</text>
    <text x="925" y="200" fill="#94A3B8" font-size="11">branchId : ObjectId</text>
    <text x="900" y="217" fill="#06B6D4" font-size="11">type : low | out_of_stock</text>
    <text x="900" y="234" fill="#94A3B8" font-size="11">message : String</text>
    <text x="900" y="251" fill="#06B6D4" font-size="11">isRead : Boolean</text>
    <text x="900" y="268" fill="#94A3B8" font-size="11">createdAt : Date</text>
  </g>

  <!-- ═══════════════ RELATIONSHIPS ═══════════════ -->
  <!-- User → Branch (N:1) -->
  <line x1="230" y1="200" x2="300" y2="200" stroke="#0891B2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="265" y="193" fill="#06B6D4" font-size="10" text-anchor="middle">N:1</text>

  <!-- Branch → Inventory (1:N) -->
  <line x1="400" y1="300" x2="400" y2="380" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="400" y1="380" x2="140" y2="380" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="140" y1="380" x2="140" y2="420" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="270" y="373" fill="#34D399" font-size="10" text-anchor="middle">1:N</text>

  <!-- Product → Inventory (1:N) -->
  <line x1="670" y1="320" x2="670" y2="390" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="670" y1="390" x2="140" y2="390" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="140" y1="390" x2="140" y2="420" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="540" y="383" fill="#A78BFA" font-size="10" text-anchor="middle">1:N</text>

  <!-- Branch → Transfer (1:N) -->
  <line x1="400" y1="300" x2="440" y2="420" stroke="#0891B2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="427" y="370" fill="#38BDF8" font-size="10">1:N</text>

  <!-- Branch → Sale (1:N) -->
  <line x1="500" y1="200" x2="630" y2="480" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="575" y="350" fill="#F87171" font-size="10">1:N</text>

  <!-- Inventory → Alert (1:N) -->
  <line x1="250" y1="530" x2="900" y2="250" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="380" fill="#F472B6" font-size="10">triggers</text>

  <!-- Product → Transfer (1:N) -->
  <line x1="670" y1="320" x2="500" y2="490" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Legend -->
  <rect x="870" y="420" width="210" height="170" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="975" y="445" fill="white" font-size="12" font-weight="bold" text-anchor="middle">Légende</text>
  <line x1="890" y1="460" x2="1000" y2="460" stroke="#334155" stroke-width="1"/>
  <rect x="890" y="470" width="30" height="12" rx="2" fill="#0D3B66" stroke="#0891B2" stroke-width="1.5"/>
  <text x="930" y="481" fill="#94A3B8" font-size="10">Entité principale</text>
  <text x="890" y="505" fill="#F59E0B" font-size="11" font-weight="bold">PK</text>
  <text x="910" y="505" fill="#94A3B8" font-size="10">Clé primaire</text>
  <text x="890" y="525" fill="#F59E0B" font-size="11" font-weight="bold">FK</text>
  <text x="910" y="525" fill="#94A3B8" font-size="10">Clé étrangère</text>
  <line x1="890" y1="538" x2="930" y2="538" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="940" y="542" fill="#94A3B8" font-size="10">Relation 1:N</text>
  <text x="890" y="560" fill="#06B6D4" font-size="10">Bleu = Enum/Status</text>
  <text x="890" y="578" fill="#94A3B8" font-size="10">MongoDB / NoSQL Schema</text>
</svg>
